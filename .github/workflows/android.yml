name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Existing repository secrets (values are never printed).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK ($ANDROID_HOME); the
      # android-actions/setup-android action breaks on its legacy "tools" package.
      - name: Prepare Android SDK
        run: |
          set +o pipefail
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Detect signing configuration
        id: signing
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -z "$missing" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing:$missing. Building UNSIGNED release APK."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name release artifact (signed vs unsigned)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Abhyas-debug.apk
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            f=$(ls app/build/outputs/apk/release/*.apk | head -n1)
            case "$f" in
              *unsigned*) echo "::error::Signing secrets were present but release APK is unsigned."; exit 1 ;;
            esac
            cp "$f" dist/Abhyas-release-signed.apk
          else
            f=$(ls app/build/outputs/apk/release/*.apk | head -n1)
            cp "$f" dist/Abhyas-release-UNSIGNED.apk
          fi

      - name: Verify signature (signed builds only)
        if: steps.signing.outputs.available == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs dist/Abhyas-release-signed.apk | grep -v -i "digest" || true
          "$APKSIGNER" verify dist/Abhyas-release-signed.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: abhyas-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
